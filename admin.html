<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Baraka Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--green:#14532D;--green2:#1E6B3C;--gold:#C9A227;--gold2:#E3C766;--cream:#FAF7F0;--ink:#1F2937;--muted:#6B7280;--err:#B91C1C;--ok:#15803D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Atkinson Hyperlegible','Noto Nastaliq Urdu',sans-serif;background:var(--cream);color:var(--ink);font-size:15.5px;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.hidden{display:none!important}
.card{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(31,41,55,.08);padding:20px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:10px 20px;font-size:15px;font-family:inherit;cursor:pointer;min-height:46px;transition:.15s}
.btn-p{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3B2F04}
.btn-o{background:#fff;color:var(--green);border:2px solid var(--green)}
.btn-sm{min-height:36px;padding:4px 14px;font-size:13.5px}
.btn:disabled{opacity:.5}
label{display:block;font-size:13.5px;font-weight:700;color:var(--green);margin:8px 0 2px}
input,select{width:100%;min-height:44px;border:2px solid #D6D3C8;border-radius:10px;padding:6px 12px;font-size:15px;font-family:inherit;background:#fff}
input:focus,select:focus{outline:3px solid var(--gold2);border-color:var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--green2),var(--green));display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:22px}
h1{font-size:20px;color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:linear-gradient(150deg,var(--green),var(--green2));color:#fff;border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:26px;color:var(--gold2);display:block;font-family:'Atkinson Hyperlegible'}
.stat span{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#EAF4EE;color:var(--green);padding:8px 6px;text-align:left;white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid #F1EDE0;vertical-align:top}
tr:hover td{background:#FFFDF5}
.chip{display:inline-block;border-radius:99px;padding:1px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.Active{background:#EAF4EE;color:var(--ok)}
.chip.Married{background:#FEF3C7;color:#92400E}
.chip.Closed{background:#F3F4F6;color:#6B7280}
.chip.Pending{background:#FDF6E3;color:#92700E;border:1px solid #C9A227}
.chip.m{background:#DBEAFE;color:#1D4ED8}
.chip.f{background:#FCE7F3;color:#BE185D}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:20px 8px}
#modal .mcard{background:#fff;border-radius:18px;max-width:720px;width:100%;padding:22px;position:relative;max-height:92vh;overflow-y:auto}
.mclose{position:absolute;top:10px;right:14px;background:#F3F4F6;border:none;border-radius:99px;width:38px;height:38px;font-size:17px;cursor:pointer;z-index:2}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #E5E1D5;padding:5px 2px;font-size:14.5px}
.kv b{color:var(--green);white-space:nowrap}
.sechead{background:#FDF6E3;color:var(--green);border-radius:8px;padding:4px 14px;margin:12px 0 4px;font-weight:700;font-size:14.5px;border-left:4px solid var(--gold)}
.badge{display:inline-block;background:#FEE2E2;color:var(--err);border-radius:99px;padding:2px 14px;font-size:14px;margin-top:6px}
.score{background:var(--gold2);color:#3B2F04;font-weight:700;border-radius:99px;padding:1px 12px;font-size:13px;font-family:'Atkinson Hyperlegible'}
.mono{direction:ltr;font-family:'Atkinson Hyperlegible';text-align:left}
.pphoto{width:96px;height:114px;object-fit:cover;border-radius:10px;border:3px solid var(--gold);box-shadow:0 3px 10px rgba(0,0,0,.15)}
@media(max-width:640px){ .tblwrap{overflow-x:auto} h1{font-size:17px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">🕌</div>
      <div><h1>Al-Baraka Marriage Bureau</h1><small style="color:var(--muted);font-family:'Atkinson Hyperlegible'">Al-Baraka Admin Panel</small></div>
    </div>
    <div><a href="index.html" class="btn btn-o btn-sm">🏠 Main Site</a>
    <button class="btn btn-o btn-sm hidden" id="lo" onclick="logout()">Logout</button></div>
  </div>

  <!-- LOGIN -->
  <div id="v-login" class="card" style="max-width:420px;margin:30px auto">
    <h2 style="color:var(--green)">Admin Login</h2>
    <label>Username</label>
    <input id="au" class="mono" autocomplete="username">
    <label>Password</label>
    <input id="ap" type="password" class="mono" autocomplete="current-password">
    <div id="aerr" class="badge hidden"></div>
    <div style="height:12px"></div>
    <button class="btn btn-p" style="width:100%" onclick="adminLogin()">Log in</button>
  </div>

  <!-- PANEL -->
  <div id="v-panel" class="hidden">
    <div class="stats" id="stats"></div>
<div class="card" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
<h2 style="color:var(--green)">💳 Payment Requests <span id="payc" class="score">0</span></h2>
<button class="btn btn-o btn-sm" onclick="loadPayments()">🔄 Refresh</button>
</div>
<div id="payList"><p style="color:var(--muted)">…Loading…</p></div>
</div>
<div class="card" style="display:none">
<h2 style="color:var(--green)">⚙️ Pricing & Payment Accounts</h2>
<p style="color:var(--muted);font-size:14px">Edit each fee and your payment accounts here.</p>
<div id="pricingBox"></div>
<button class="btn btn-p btn-sm" onclick="svcSavePricing()" style="margin-top:8px">💾 Save</button>
</div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <h2 style="color:var(--green)">🔎 Search Profiles</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <a class="btn btn-p btn-sm" href="index.html?byadmin=1" target="_blank">➕ Add Profile</a>
          <button class="btn btn-g btn-sm" onclick="applyFilters()">Search</button>
        </div>
      </div>
      <div class="grid">
        <div><label>Search (Name / ID / Mobile)</label><input id="f-q" placeholder="ABM-0001 or 03xx-xxxxxxx"></div>
        <div><label>Gender</label><select id="f-gender"><option value="">All</option><option value="male">Male</option><option value="female">Female</option></select></div>
        <div><label>Min Age</label><input id="f-ageMin" inputmode="numeric" placeholder="20"></div>
        <div><label>Max Age</label><input id="f-ageMax" inputmode="numeric" placeholder="30"></div>
        <div><label>District</label><input id="f-district" placeholder="Lahore"></div>
        <div><label>City</label><input id="f-city"></div>
        <div><label>Caste</label><input id="f-caste" placeholder="Jutt, Arain…"></div>
        <div><label>Sect</label><select id="f-sect"><option value="">All</option><option>سنی</option><option>اہلحدیث</option><option>دیوبندی</option><option>بریلوی</option><option>شیعہ</option><option>دیگر</option></select></div>
        <div><label>Education</label><input id="f-education" placeholder="Doctor, Engineer…"></div>
        <div><label>Marital Status</label><select id="f-marital"><option value="">All</option><option value="single">Single</option><option value="divorced">Divorced</option><option value="widowed">Widowed</option><option value="second">Second marriage</option></select></div>
        <div><label>Status</label><select id="f-status"><option value="">All</option><option value="Pending">Pending</option><option value="Active">Active</option><option value="Married">Married</option><option value="Closed">Closed</option></select></div>
      </div>
      <div style="margin-top:8px"><button class="btn btn-o btn-sm" onclick="clearFilters()">Clear</button></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="color:var(--green)">Results <span id="rc" class="score">0</span> <small style="color:var(--muted);font-size:12px" id="loadms"></small></h2>
        <button class="btn btn-o btn-sm" onclick="boot(1)">🔄 Refresh</button>
      </div>
      <div class="tblwrap">
        <table id="tbl">
          <thead><tr><th>ID</th><th>Name</th><th>Gender</th><th>Age</th><th>Height</th><th>City</th><th>Caste</th><th>Sect</th><th>Education</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div id="modal" class="hidden" onclick="if(event.target===this)closeModal()">
  <div class="mcard">
    <button class="mclose noprint" onclick="closeModal()">✖</button>
    <div id="mbody"></div>
    <div class="noprint" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-g btn-sm" onclick="waShare()">💚 Share</button>
      <button class="btn btn-p btn-sm" onclick="downloadPDF()">📄 Download PDF</button>
      <button class="btn btn-o btn-sm" onclick="findMatches()">💞 Find Matches</button>
      <button class="btn btn-o btn-sm" onclick="resetPw()">🔑 Reset Password</button>
      <select id="mstatus" style="width:auto;min-height:36px" onchange="changeStatus()">
        <option value="Pending">Pending</option><option value="Active">Active</option><option value="Married">Married</option><option value="Closed">Closed</option>
      </select>
    </div>
    <div class="noprint" id="pendActions" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"></div>
    <div id="matches"></div>
  </div>
</div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyiwXhESs14FwefGa6tMOTCed7U-P4BJaIR4UYTOiGrsFwSm1wuCP2NRS1id0tD1aJPUg/exec',
  SUPPORT_WHATSAPP: '923154822167'
};
let TOKEN = sessionStorage.getItem('admToken') || '';
let ALL = [], CUR = null;

const MS = { single: 'Single', divorced: 'Divorced', widowed: 'Widowed', second: 'Second marriage' };
const G = { male: 'Male', female: 'Female' };
const YN = { yes: 'Yes', no: 'No', always: 'Always', sometimes: 'Sometimes', rarely: 'Rarely' };
const HT = { owned: 'Owned', rented: 'Rented' };
const ST = { Active: 'Active', Married: 'Married', Closed: 'Closed', Pending: 'Pending' };
function v(x) { return (x == null || x === '') ? '—' : x; }
// Drive viewer URLs cannot render inside <img>; convert to the thumbnail endpoint
function thumb(u, size) {
  const m = String(u || '').match(/[-\w]{25,}/);
  return m ? ('https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w' + (size || 400)) : '';
}

async function api(action, payload, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, ms || 25000);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, token: TOKEN }, payload || {})),
      signal: ctrl.signal
    });
    return await res.json();
  } catch (e) {
    return { ok: false, error: e.name === 'AbortError' ? 'TIMEOUT' : String(e.message || e) };
  } finally { clearTimeout(timer); }
}

async function adminLogin() {
  const err = document.getElementById('aerr'); err.classList.add('hidden');
  const r = await api('adminLogin', { username: document.getElementById('au').value.trim(), password: document.getElementById('ap').value });
  if (!r.ok) { err.textContent = 'Wrong username or password'; err.classList.remove('hidden'); return; }
  TOKEN = r.token; sessionStorage.setItem('admToken', TOKEN);
  enter();
}
function logout() { TOKEN = ''; sessionStorage.removeItem('admToken'); location.reload(); }

async function enter() {
  document.getElementById('v-login').classList.add('hidden');
  document.getElementById('v-panel').classList.remove('hidden');
  document.getElementById('lo').classList.remove('hidden');
  boot();
}

let FILTERED = [];
async function boot(fresh) {
  const t0 = Date.now();
  const tb = document.getElementById('tbody');
  if (!fresh) {
    try {
      const c = JSON.parse(sessionStorage.getItem('admCache') || 'null');
      if (c && c.list && c.list.length) { ALL = c.list; renderStats(c.stats || {}); applyFilters(); }
    } catch (e) {}
  }
  if (!ALL.length) tb.innerHTML = '<tr><td colspan="11" style="text-align:center">\u23f3 Loading\u2026</td></tr>';
  const r = await api('adminBoot', fresh ? { fresh: 1 } : {});
  if (!r.ok) {
    if (ALL.length) return;
    if (r.error === 'TIMEOUT') { tb.innerHTML = '<tr><td colspan="11" style="text-align:center">\u26a0\ufe0f Server slow \u2014 <button class="btn btn-o btn-sm" onclick="boot(1)">Retry</button></td></tr>'; return; }
    return authFail(r);
  }
  ALL = r.list || [];
  try { sessionStorage.setItem('admCache', JSON.stringify({ list: ALL, stats: r.stats })); } catch (e) {}
  renderStats(r.stats || {});
  applyFilters();
  const el = document.getElementById('loadms');
  if (el) el.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's' + (r.cached ? ' (cached)' : '');
}

function renderStats(s) {
  const topD = Object.entries(s.byDistrict || {}).sort((a, b) => b[1] - a[1]).slice(0, 1).map(d => d[0] + ' (' + d[1] + ')').join('') || '—';
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${s.total}</b><span>Total</span></div>
    <div class="stat"><b>${s.male}</b><span>Male</span></div>
    <div class="stat"><b>${s.female}</b><span>Female</span></div>
    <div class="stat"><b>${s.active}</b><span>Active</span></div>
    <div class="stat"><b>${s.married}</b><span>Married</span></div>
    <div class="stat" style="background:linear-gradient(150deg,#92700E,#C9A227)"><b>${s.pending || 0}</b><span>Pending</span></div>
    <div class="stat"><b style="font-size:16px;line-height:2.2">${topD}</b><span>Top District</span></div>`;
}

function filters() {
  return {
    q: gv('f-q'), gender: gv('f-gender'), ageMin: gv('f-ageMin'), ageMax: gv('f-ageMax'),
    district: gv('f-district'), city: gv('f-city'), caste: gv('f-caste'), sect: gv('f-sect'),
    education: gv('f-education'), maritalStatus: gv('f-marital'), status: gv('f-status')
  };
}
function gv(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function clearFilters() { document.querySelectorAll('#v-panel input,#v-panel select').forEach(e => e.value = ''); applyFilters(); }

function txt(a) { return String(a == null ? '' : a).toLowerCase(); }
function hasTxt(a, b) { return txt(a).indexOf(txt(b)) !== -1; }
function applyFilters() {
  const f = filters();
  FILTERED = ALL.filter(function (p) {
    if (f.gender && p.gender !== f.gender) return false;
    if (f.status && p.status !== f.status) return false;
    if (f.maritalStatus && p.maritalStatus !== f.maritalStatus) return false;
    if (f.ageMin && Number(p.age) < Number(f.ageMin)) return false;
    if (f.ageMax && Number(p.age) > Number(f.ageMax)) return false;
    if (f.district && !hasTxt(p.district, f.district)) return false;
    if (f.city && !hasTxt(p.city, f.city)) return false;
    if (f.caste && !hasTxt(p.caste, f.caste)) return false;
    if (f.sect && !hasTxt(p.sect, f.sect)) return false;
    if (f.education && !hasTxt(p.education, f.education)) return false;
    if (f.q && !(hasTxt(p.fullName, f.q) || hasTxt(p.id, f.q) || hasTxt(p.mobile, f.q))) return false;
    return true;
  });
  renderTable(FILTERED);
}
function search() { boot(1); }

const PAGE = 50;
let shown = PAGE;
function rowHtml(p, i) {
  return `<tr>
      <td class="mono"><b>${v(p.id)}</b></td><td>${v(p.fullName)}</td>
      <td><span class="chip ${p.gender === 'male' ? 'm' : 'f'}">${G[p.gender] || '—'}</span></td>
      <td>${v(p.age)}</td><td class="mono">${v(p.height)}</td><td>${v(p.city || p.district)}</td>
      <td>${v(p.caste)}</td><td>${v(p.sect)}</td><td>${v(p.education)}</td>
      <td><span class="chip ${p.status}">${ST[p.status] || v(p.status)}</span></td>
      <td><button class="btn btn-p btn-sm" onclick="openP(${i})">View</button></td>
    </tr>`;
}
function renderTable(list, keepPage) {
  if (!keepPage) shown = PAGE;
  document.getElementById('rc').textContent = list.length;
  const slice = list.slice(0, shown);
  const more = list.length > shown ? `<tr><td colspan="11" style="text-align:center;padding:12px"><button class="btn btn-o btn-sm" onclick="showMore()">Show more (${list.length - shown} remaining)</button></td></tr>` : '';
  document.getElementById('tbody').innerHTML = list.length ? slice.map(function(p,i){return rowHtml(p,i);}).join('') + more : '<tr><td colspan="11" style="text-align:center">No profiles found</td></tr>';
}
function showMore() { shown += PAGE; renderTable(FILTERED, true); }

function authFail(r) {
  if (r.error === 'AUTH') { logout(); }
  else alert('Error: ' + r.error);
}

async function openP(i) {
  const light = FILTERED[i];
  if (!light) return;
  showProfile(light);
  const r = await api('adminProfile', { profileId: light.id });
  if (r.ok && r.profile) showProfile(r.profile);
}
async function openById(id) {
  const r = await api('adminProfile', { profileId: id });
  if (r.ok && r.profile) showProfile(r.profile); else alert('Error: ' + r.error);
}
function showProfile(p) {
  CUR = p;
  const headPhoto = p.photo1Url
    ? `<a href="${p.photo1Url}" target="_blank" title="Open full photo"><img class="pphoto" src="${thumb(p.photo1Url, 300)}" onerror="this.style.display='none'"></a>`
    : '';
  const gallery = [p.photo1Url, p.photo2Url].filter(Boolean).map(u =>
    `<a href="${u}" target="_blank"><img src="${thumb(u, 300)}" style="width:110px;height:130px;object-fit:cover;border-radius:10px;border:2px solid var(--gold);margin:4px" onerror="this.outerHTML='<a href=&quot;${u}&quot; target=&quot;_blank&quot; class=&quot;btn btn-o btn-sm&quot;>🖼️ Photo</a>'"></a>`).join(' ');
  const cnic = [p.cnicFrontUrl, p.cnicBackUrl].filter(Boolean).map((u, i) => `<a href="${u}" target="_blank" class="btn btn-o btn-sm noprint">🪪 CNIC ${i + 1}</a>`).join(' ');
  document.getElementById('mbody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--gold);padding-bottom:10px;margin-bottom:6px">
      <div>
        <h2 style="color:var(--green);margin-bottom:4px">${v(p.fullName)}</h2>
        <span class="mono" style="font-weight:700;color:var(--green);font-size:17px">${v(p.id)}</span>
        <span class="chip ${p.status}">${ST[p.status] || v(p.status)}</span>
      </div>
      ${headPhoto}
    </div>
    <div class="sechead">Personal Information</div>
    ${kv('Gender', G[p.gender])}${kv('Age / DOB', v(p.age) + (p.dob ? ' — ' + p.dob : ''))}${kv('Height', p.height)}
    ${kv('Marital Status', MS[p.maritalStatus])}${kv('Children', p.children)}${kv('CNIC', p.cnic)}
    ${kv('Caste', p.caste)}${kv('Mother Tongue', p.motherTongue)}${kv('Complexion', p.complexion)}
    <div class="sechead">Religious Information</div>
    ${kv('Religion / Sect', v(p.religion) + ' / ' + v(p.sect))}
    ${kv('Hafiz-e-Quran', YN[p.hafizQuran])}${kv('Prayers', YN[p.prayerRegular])}${p.gender === 'female' ? kv('Purdah', YN[p.purdah]) : ''}
    <div class="sechead">Education &amp; Work</div>
    ${kv('Education', p.education)}${kv('Profession', v(p.profession) + (p.company ? ' — ' + p.company : ''))}${kv('Income', p.income)}
    <div class="sechead">Residence</div>
    ${kv('Province / District', v(p.province) + ' / ' + v(p.district))}${kv('City / Village', p.city)}${kv('House', HT[p.houseType])}
    <div class="sechead">Family</div>
    ${kv('Guardian', p.guardianName)}${kv('Father\'s Occupation', p.fatherOccupation)}${kv('Mother\'s Occupation', p.motherOccupation)}
    ${kv('Brothers / Sisters', v(p.brothers) + ' / ' + v(p.sisters))}
    ${kv('Married Brothers / Sisters', v(p.marriedBrothers) + ' / ' + v(p.marriedSisters))}
    ${kv('Birth Order', p.birthOrder)}
    <div class="sechead">Contact</div>
    ${kv('Mobile', p.mobile)}${kv('Alternate', p.altMobile)}${kv('Verified Contact', p.contact)}
    <div class="sechead">Partner Preferences</div>
    ${kv('Age / Height', v(p.prefAge) + ' / ' + v(p.prefHeight))}${kv('Education / City', v(p.prefEducation) + ' / ' + v(p.prefCity))}
    ${kv('Caste / Sect', v(p.prefCaste) + ' / ' + v(p.prefSect))}${kv('Preferred Marital Status', MS[p.prefMaritalStatus] || (p.prefMaritalStatus ? p.prefMaritalStatus : 'Any'))}${kv('Other Conditions', p.otherConditions)}
    <div style="margin-top:10px">${gallery}</div>
    <div style="margin-top:6px">${cnic}</div>`;
  document.getElementById('mstatus').value = p.status || 'Active';
  document.getElementById('matches').innerHTML = '';
  const pa = document.getElementById('pendActions');
  pa.innerHTML = '';

/* ---- matching ---- */
function findMatches() {
  const p = CUR;
  const box = document.getElementById('matches');
  box.innerHTML = '<div class="sechead">💞 Finding possible matches…</div>';
  const scored = ALL.filter(function (c) { return c.gender === (p.gender === 'male' ? 'female' : 'male') && c.status === 'Active'; }).map(c => {
    let sc = 0, why = [];
    const ar = String(p.prefAge || '').match(/(\d+)\D+(\d+)/);
    if (ar && c.age && +c.age >= +ar[1] && +c.age <= +ar[2]) { sc += 25; why.push('age match'); }
    if (p.prefCity && (has(c.city, p.prefCity) || has(c.district, p.prefCity))) { sc += 20; why.push('city match'); }
    if (p.prefCaste && has(c.caste, p.prefCaste)) { sc += 20; why.push('caste match'); }
    if (p.prefSect && has(c.sect, p.prefSect)) { sc += 15; why.push('sect match'); }
    else if (p.sect && c.sect === p.sect) { sc += 10; why.push('same sect'); }
    if (p.prefEducation && has(c.education, p.prefEducation)) { sc += 15; why.push('education match'); }
    if (!p.prefCity && p.district && c.district === p.district) { sc += 10; why.push('same district'); }
    if (p.caste && c.caste && has(c.caste, p.caste)) { sc += 5; }
    return { c, sc, why };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 10);
  box.innerHTML = '<div class="sechead">💞 Possible Matches (' + scored.length + ')</div>' +
    (scored.length ? scored.map(x => `
      <div class="kv"><b class="mono">${x.c.id}</b>
        <span>${v(x.c.fullName)} — ${v(x.c.age)} yrs, ${v(x.c.city || x.c.district)}, ${v(x.c.caste)}</span>
        <span><span class="score">${x.sc}%</span>
        <button class="btn btn-o btn-sm noprint" onclick="openById('${x.c.id}')">View</button></span>
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin:0 4px 6px">${x.why.join(' • ')}</div>`).join('')
      : '<p style="text-align:center;color:var(--muted)">No suitable match found — adjust filters and search manually.</p>');
}
function has(a, b) { return String(a || '').toLowerCase().includes(String(b || '').toLowerCase()); }
